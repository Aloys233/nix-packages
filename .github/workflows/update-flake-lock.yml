name: "Update Flake Lock and Cache"

on:
  schedule:
    # 每周一和周四 UTC 03:00（北京时间 11:00）自动检查更新
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

jobs:
  update-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: aloys23
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Update nixpkgs in flake.lock
        id: update
        run: |
          nix flake update nixpkgs --accept-flake-config
          if ! git diff --quiet flake.lock; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "flake.lock updated!"
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "flake.lock is already up to date."
          fi

      - name: Build and Cache Packages to Cachix
        if: steps.update.outputs.has_changes == 'true'
        run: |
          echo "Building packages with updated nixpkgs..."
          nix build .#quickflare --print-build-logs --accept-flake-config
          nix build .#komiraquake --print-build-logs --accept-flake-config
          nix build .#otomusic --print-build-logs --accept-flake-config

      - name: Commit and push changes
        if: steps.update.outputs.has_changes == 'true'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(flake): bump nixpkgs in flake.lock"
          file_pattern: "flake.lock"
