name: "Auto Update Quickflare Package"

on:
  repository_dispatch:
    types: [ update-quickflare ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.4)'
        required: true
        default: 'v0.1.3'

jobs:
  update-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Extract version info
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.event.client_payload.version }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update package definition
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating Quickflare to $TAG ($VERSION)..."

          # 1. 计算 GitHub 源码解压哈希
          RAW_HASH=$(nix-prefetch-url --unpack "https://github.com/Aloys233/quickflare/archive/refs/tags/${TAG}.tar.gz")
          SRC_HASH=$(nix hash convert --to sri "$RAW_HASH")
          echo "Source Hash: $SRC_HASH"

          # 2. 替换版本号与源码哈希
          sed -i "s/version = \"[^\"]*\";/version = \"$VERSION\";/" pkgs/quickflare/default.nix
          # 替换第一个匹配到的 hash (即 src 对应的 hash)
          sed -i "0,/hash = \"sha256-[^\"]*\";/s//hash = \"$SRC_HASH\";/" pkgs/quickflare/default.nix

          # 3. 将 pnpmDeps hash 和 cargoHash 置为 fakeHash 触发重算
          sed -i "s|hash = \"sha256-[^\"]*\";|hash = lib.fakeHash;|g" pkgs/quickflare/default.nix
          # 把刚刚写入的 src hash 还原
          sed -i "0,/hash = lib.fakeHash;/s//hash = \"$SRC_HASH\";/" pkgs/quickflare/default.nix
          sed -i "s|cargoHash = \"sha256-[^\"]*\";|cargoHash = lib.fakeHash;|" pkgs/quickflare/default.nix

          # 4. 获取真实的 pnpmDeps hash
          PNPM_BUILD_OUT=$(nix build .#quickflare --accept-flake-config 2>&1 || true)
          PNPM_HASH=$(echo "$PNPM_BUILD_OUT" | grep -oP 'got:\s+\K(sha256-[a-zA-Z0-9+/=]+)' | head -n 1)
          if [ -n "$PNPM_HASH" ]; then
            echo "Calculated pnpmDeps Hash: $PNPM_HASH"
            sed -i "s|hash = lib.fakeHash;|hash = \"$PNPM_HASH\";|" pkgs/quickflare/default.nix
          fi

          # 5. 获取真实的 cargoHash
          CARGO_BUILD_OUT=$(nix build .#quickflare --accept-flake-config 2>&1 || true)
          CARGO_HASH=$(echo "$CARGO_BUILD_OUT" | grep -oP 'got:\s+\K(sha256-[a-zA-Z0-9+/=]+)' | head -n 1)
          if [ -n "$CARGO_HASH" ]; then
            echo "Calculated cargoHash: $CARGO_HASH"
            sed -i "s|cargoHash = lib.fakeHash;|cargoHash = \"$CARGO_HASH\";|" pkgs/quickflare/default.nix
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(quickflare): bump to ${{ steps.version.outputs.tag }}"
          file_pattern: "pkgs/quickflare/default.nix"
