name: "Auto Update Quickflare Package"

on:
  repository_dispatch:
    types: [ update-quickflare ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.4)'
        required: true
        default: 'v0.1.4'

jobs:
  update-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Extract version info
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.event.client_payload.version }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update package definition
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating Quickflare to $TAG ($VERSION)..."

          # 1. 计算 GitHub 源码解压哈希并转换为 SRI 格式
          RAW_HASH=$(nix-prefetch-url --unpack "https://github.com/Aloys233/quickflare/archive/refs/tags/${TAG}.tar.gz" 2>/dev/null | tail -n 1 | tr -d '[:space:]')
          SRC_HASH=$(nix hash convert --hash-algo sha256 --to sri "$RAW_HASH")
          echo "Source Hash: $SRC_HASH"

          # 2. 先写入新版本号和新源码哈希，将依赖哈希置为假哈希以触发 Nix 校验
          python3 -c "
          import re
          with open('pkgs/quickflare/default.nix', 'r') as f:
              c = f.read()
          c = re.sub(r'version = \"[^\"]*\";', f'version = \"$VERSION\";', c, count=1)
          c = re.sub(r'(src = fetchFromGitHub \{[\s\S]*?hash = \")[^\"]*(\";)', rf'\g<1>$SRC_HASH\g<2>', c)
          c = re.sub(r'(pnpmDeps = fetchPnpmDeps \{[\s\S]*?hash = \")[^\"]*(\";)', r'\g<1>sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\g<2>', c)
          c = re.sub(r'cargoHash = \"[^\"]*\";', 'cargoHash = \"sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=\";', c)
          with open('pkgs/quickflare/default.nix', 'w') as f:
              f.write(c)
          "

          # 3. 运行构建以获取真实的 pnpmDeps 哈希
          echo "Resolving pnpmDeps hash..."
          PNPM_OUT=$(nix build .#quickflare --accept-flake-config 2>&1 || true)
          PNPM_HASH=$(echo "$PNPM_OUT" | grep -oP 'got:\s+\K(sha256-[a-zA-Z0-9+/=]+)' | head -n 1)
          if [ -n "$PNPM_HASH" ]; then
            echo "Found pnpmDeps hash: $PNPM_HASH"
            python3 -c "
            import re
            with open('pkgs/quickflare/default.nix', 'r') as f:
                c = f.read()
            c = re.sub(r'(pnpmDeps = fetchPnpmDeps \{[\s\S]*?hash = \")[^\"]*(\";)', rf'\g<1>$PNPM_HASH\g<2>', c)
            with open('pkgs/quickflare/default.nix', 'w') as f:
                f.write(c)
            "
          fi

          # 4. 运行构建以获取真实的 cargoHash
          echo "Resolving cargoHash..."
          CARGO_OUT=$(nix build .#quickflare --accept-flake-config 2>&1 || true)
          CARGO_HASH=$(echo "$CARGO_OUT" | grep -oP 'got:\s+\K(sha256-[a-zA-Z0-9+/=]+)' | head -n 1)
          if [ -n "$CARGO_HASH" ]; then
            echo "Found cargoHash: $CARGO_HASH"
            python3 -c "
            import re
            with open('pkgs/quickflare/default.nix', 'r') as f:
                c = f.read()
            c = re.sub(r'cargoHash = \"[^\"]*\";', f'cargoHash = \"$CARGO_HASH\";', c)
            with open('pkgs/quickflare/default.nix', 'w') as f:
                f.write(c)
            "
          fi

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(quickflare): bump to ${{ steps.version.outputs.tag }}"
          file_pattern: "pkgs/quickflare/default.nix"
