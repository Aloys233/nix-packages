name: "Auto Update Quickflare Package"

on:
  repository_dispatch:
    types: [ update-quickflare ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v0.1.4)'
        required: true
        default: 'v0.1.4'

jobs:
  update-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: aloys23
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Extract version info
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.event.client_payload.version }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update package definition
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          echo "Updating Quickflare to $TAG ($VERSION)..."

          # 1. 计算 GitHub 源码解压哈希并转换为 SRI 格式
          RAW_HASH=$(nix-prefetch-url --unpack "https://github.com/Aloys233/quickflare/archive/refs/tags/${TAG}.tar.gz" 2>/dev/null | tail -n 1 | tr -d '[:space:]')
          SRC_HASH=$(nix hash convert --hash-algo sha256 --to sri "$RAW_HASH")
          echo "Source Hash: $SRC_HASH"
          python3 .github/scripts/update-package.py --version "$VERSION" --src-hash "$SRC_HASH"

          # 2. 独立解析真实的 pnpmDeps 哈希
          echo "Resolving pnpmDeps hash..."
          python3 .github/scripts/update-package.py --pnpm-hash "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          PNPM_OUT=$(nix build .#quickflare.pnpmDeps --accept-flake-config 2>&1 || true)
          PNPM_HASH=$(echo "$PNPM_OUT" | grep -oP 'got:\s+\K(sha256-[a-zA-Z0-9+/=]+)' | head -n 1)
          if [ -n "$PNPM_HASH" ]; then
            echo "Found pnpmDeps hash: $PNPM_HASH"
            python3 .github/scripts/update-package.py --pnpm-hash "$PNPM_HASH"
          else
            echo "Error: Failed to resolve pnpmDeps hash!"
            echo "$PNPM_OUT"
            exit 1
          fi

          # 3. 独立解析真实的 cargoHash
          echo "Resolving cargoHash..."
          python3 .github/scripts/update-package.py --cargo-hash "sha256-AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA="
          CARGO_OUT=$(nix build .#quickflare.cargoDeps --accept-flake-config 2>&1 || true)
          CARGO_HASH=$(echo "$CARGO_OUT" | grep -oP 'got:\s+\K(sha256-[a-zA-Z0-9+/=]+)' | head -n 1)
          if [ -n "$CARGO_HASH" ]; then
            echo "Found cargoHash: $CARGO_HASH"
            python3 .github/scripts/update-package.py --cargo-hash "$CARGO_HASH"
          else
            echo "Error: Failed to resolve cargoHash!"
            echo "$CARGO_OUT"
            exit 1
          fi

      - name: Build and Cache Quickflare
        run: nix build .#quickflare --print-build-logs --accept-flake-config

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(quickflare): bump to ${{ steps.version.outputs.tag }}"
          file_pattern: "pkgs/quickflare/default.nix"
