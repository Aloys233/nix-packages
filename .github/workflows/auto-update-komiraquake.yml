name: "Auto Update KomiraQuake Package"

on:
  repository_dispatch:
    types: [ update-komiraquake ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

env:
  REPO_URL: https://github.com/Aloys233/KomiraQuake-Desktop.git
  PACKAGE_FILE: pkgs/komiraquake/default.nix

jobs:
  update-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: aloys23
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Extract version info
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${{ github.event.client_payload.version }}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update package definition
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          echo "Updating KomiraQuake to $TAG ($VERSION)..."

          # 1. 解析 tag 指向的 commit（解引用 annotated tag）
          REV=$(git ls-remote "$REPO_URL" "refs/tags/${TAG}^{}" | cut -f1)
          if [ -z "$REV" ]; then
            REV=$(git ls-remote "$REPO_URL" "refs/tags/${TAG}" | cut -f1)
          fi
          if [ -z "$REV" ]; then
            echo "Error: tag '${TAG}' not found in $REPO_URL"
            exit 1
          fi
          echo "Resolved ${TAG} -> ${REV}"

          # 2. 计算源码解压哈希并转换为 SRI 格式
          RAW_HASH=$(nix-prefetch-url --unpack "https://github.com/Aloys233/KomiraQuake-Desktop/archive/${REV}.tar.gz" 2>/dev/null | tail -n1 | tr -d '[:space:]')
          SRC_HASH=$(nix hash convert --hash-algo sha256 --to sri "$RAW_HASH")
          echo "Source Hash: $SRC_HASH"

          python3 .github/scripts/update-package.py \
            --version "$VERSION" \
            --rev "$REV" \
            --src-hash "$SRC_HASH" \
            --file "$PACKAGE_FILE"

      - name: Build and Cache KomiraQuake
        run: nix build .#komiraquake --print-build-logs --accept-flake-config

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(komiraquake): bump to ${{ steps.version.outputs.tag }}"
          file_pattern: "pkgs/komiraquake/default.nix"
