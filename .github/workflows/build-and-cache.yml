name: "Build and Cache to Cachix"

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Setup Cachix
        uses: cachix/cachix-action@v15
        with:
          name: aloys23
          authToken: '${{ secrets.CACHIX_AUTH_TOKEN }}'

      - name: Build Quickflare
        run: nix build .#quickflare --print-build-logs --accept-flake-config
